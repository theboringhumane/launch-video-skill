<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #ffffef; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- The root holds scene hosts and audio only. Its data-duration is the video's length. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="4" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- voice: one file per line, placed ~0.3 s into its scene -->
      <audio id="vo1" src="assets/vo/l1.wav" data-start="0.4" data-duration="2.2" data-track-index="2" data-volume="1"></audio>

      <!-- music under voice at ~0.2; fade the end -->
      <audio id="music" src="assets/bgm/track.m4a" data-start="0" data-duration="12" data-track-index="3" data-volume="0.2" data-fade-in="0.4" data-fade-out="2"></audio>

      <!-- sfx on visible actions only -->
      <audio id="sfx-whoosh1" src="assets/sfx/whoosh-short.mp3" data-start="3.75" data-duration="0.6" data-track-index="4" data-volume="0.35"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
